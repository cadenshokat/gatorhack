# Builds the mobile study site from apps/study and publishes only that build to GitHub Pages, at
# https://<owner>.github.io/<repo>/. Nothing else in the repo is served.
# The study settings below are the same as apps/study/.env.local: change both together. None is secret: they all end
# up in the site's code, and the key is Supabase's public (anon) key, which can only add rows. With all of them set,
# anyone who opens the link takes part for real and their answers are saved.

name: Study site on GitHub Pages

# The study lives on study/mobile-sandbox, so that branch must be allowed under Settings → Environments → github-pages.
on:
  push:
    branches: [study/mobile-sandbox]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/study
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          STUDY_PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_STUDY_SUPABASE_URL: "https://qzkcrqqcgpwqxuvospsp.supabase.co"
          VITE_STUDY_SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6a2NycXFjZ3B3cXh1dm9zcHNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2ODU2MjMsImV4cCI6MjEwNjI2MTYyM30.7QsJwV3Rpim2NSETwPNw5jGZUxiS1u1zMsKhPaP9B0U"
          VITE_STUDY_CONTACT: "cadenshokat@ufl.edu"
          VITE_STUDY_TEAM: "The WebAble team at the University of Florida"
          VITE_STUDY_APPROVAL: "The University of Florida's ethics board, the IRB, has reviewed this study. It decided the study is exempt from full review. The reference is ET00056117, from 14 September 2026. The lead researcher is Neha Rani, neharani@ufl.edu. For questions about your rights in this study, email the UF IRB at irb@ufl.edu."
          VITE_STUDY_RETENTION: "Only the study team can see your answers. We store them under a code. We keep your first name apart from your results and use it only to check that nobody takes part twice. We keep your answers with no end date, unless you ask us to delete them."
          VITE_STUDY_WITHDRAW_BY: "any time"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/study/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
